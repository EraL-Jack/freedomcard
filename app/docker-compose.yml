# 一键部署（骨架版）。
#
# ⚠️ 本机无 Docker / WSL —— 本文件**未经本机验证**，属留档件。
# 部署验证须在云主机上进行；测试报告中该项必须标注「本机未验证」，不得写通过。

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: freedomcard/server:0.1.0
    container_name: freedomcard-server
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      SERVE_STATIC: '1'
      LOG_LEVEL: info
    volumes:
      # 每局回放落盘，容器重建不丢。
      - ./replays:/app/replays
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


name: CI

on:
  push:
    branches: [master]
  pull_request:

# 同一分支上的新推送会取消仍在跑的旧任务，省机器时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    # 正常 30~60 秒。不写 timeout 等于允许一次挂起堵住队列 6 小时（见 e2e 那段注释）。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 仓库根没有 package.json（工程在 app/ 下），无法靠 packageManager 自动识别，故显式锁版本。
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: app
        run: pnpm typecheck

      - name: Lint
        working-directory: app
        run: pnpm lint

      - name: 单测
        working-directory: app
        run: pnpm test

  e2e:
    name: 端到端（Chromium）
    runs-on: ubuntu-latest
    # 正常 7~10 分钟（84 条）。留 3 倍余量，同时把「挂起」的代价封在 30 分钟内：
    # 2026-10-22 run 39783536963 在 apt 上挂了 6 小时才撞上 GitHub 的 360 分钟上限。
    timeout-minutes: 30
    # 需要下载浏览器，单列一个 job，失败不影响质量闸门先出结果。
    steps:
      - uses: actions/checkout@v4
      # 仓库根没有 package.json（工程在 app/ 下），无法靠 packageManager 自动识别，故显式锁版本。
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: app
        run: pnpm install --frozen-lockfile

      # ⚠️ 不要把 apt 放进关键路径（D-316 第二轮）。
      #
      # `--with-deps` 会调 apt，而 apt **自己没有超时**：镜像一卡就无限等 ——
      # 2026-10-22 run 39783536963 就卡在 `azure.archive.ubuntu.com` 的 InRelease 上，
      # 从 13:04 挂到 19:04 撞 6 小时上限。
      #
      # 第一版对策是「`timeout 300` 兜住 + 重试」，结果**制造了新问题**（run 120059757539）：
      # 第 1 次被 timeout 杀在安装中途，apt-get 变成孤儿进程仍攥着
      # `/var/lib/dpkg/lock-frontend`，第 2、3 次立刻 `E: Could not get lock … exit 100`。
      # 而且第 1 次其实是在**正常下载，只是慢**（26MB 字体包走了 5 分钟）。
      #
      # 那次 apt 的输出还说明了另一件事：`8 upgraded, 9 newly installed`，新装的几乎全是
      # **字体**（fonts-wqy-zenhei / fonts-unifont / fonts-ipafont-gothic）——
      # Chromium 需要的系统库（nss3 / glib / xvfb）runner 镜像里本来就有。
      #
      # 所以：浏览器本体单独装（纯 CDN 下载，可安全重试），字体另开一步、失败不阻断。
      - name: 安装 Chromium（只下浏览器，不走 apt）
        working-directory: app/packages/client
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            echo "::group::下载尝试 $i / 3"
            if timeout --kill-after=20 240 pnpm exec playwright install chromium; then
              echo "::endgroup::"
              echo "第 $i 次下载成功"
              exit 0
            fi
            echo "::endgroup::"
            echo "第 $i 次下载失败，5 秒后重试"
            sleep 5
          done
          echo "::error::Chromium 连续 3 次下载失败（CDN 侧问题，与 apt 无关）。"
          exit 1

      # 系统依赖与字体走 apt，**完全退出关键路径**：装了更好（CJK 字形正确），
      # 装不上也照跑 —— 镜像抖动不该把一条 84 用例的流水线判红。
      # apt 的超时在这里显式设好（默认 http 120s 且无总超时），最坏 6 分钟结束；
      # 而且这一步**从不主动 kill**，所以不会留下 dpkg 锁坑下一次重试。
      - name: 安装系统依赖与中文字体（可选，失败不阻断）
        working-directory: app/packages/client
        continue-on-error: true
        timeout-minutes: 6
        run: |
          echo 'Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeout >/dev/null
          pnpm exec playwright install-deps chromium

      - name: 端到端
        working-directory: app/packages/client
        run: pnpm test:e2e

      # 失败时**必须**带得走现场：截图只覆盖少数用例，真正定位靠 trace。
      # 2026-10-22 两次失败都只上传了 screenshots，没有 test-results，
      # 只能对着日志里两行 Call log 反推。
      - name: 上传失败现场（trace + 截图）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            app/packages/client/test-results
            app/packages/client/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传截图（通过时留观感证据）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: app/packages/client/e2e/screenshots
          if-no-files-found: ignore
